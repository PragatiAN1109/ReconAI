name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Java 21
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn --batch-mode test

  agent:
    name: Investigation Service — Python 3.12
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/pyproject.toml

      - name: Install investigation service
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run investigation service tests
        run: python -m pytest -q

  frontend:
    name: Frontend — Node
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest
    needs: [backend, agent, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build financial core image
        run: docker build -f backend/Dockerfile -t reconai-financial-core:ci ./backend

      - name: Build investigation service image
        run: docker build -f agent-service/Dockerfile -t reconai-investigation-service:ci .

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate