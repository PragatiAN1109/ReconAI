[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconai-investigation-service"
version = "0.1.0"
description = "AI-assisted investigation service for ReconAI reconciliation exceptions"
readme = "README.md"
requires-python = ">=3.12"

# Runtime only. No model provider SDK and no agent framework: neither is used
# yet, and an unused dependency is still one to patch and audit.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Native asyncio Kafka client. Chosen over confluent-kafka, whose synchronous
    # C-extension API would need a background thread bridged into FastAPI's event
    # loop, and over kafka-python-ng, which is synchronous and less actively
    # maintained. Three pure-Python transitive dependencies.
    "aiokafka>=0.12,<1.0",
    # SQLAlchemy 2.x async + asyncpg: the conventional async stack for FastAPI,
    # and the only one of the mainstream options that speaks asyncio natively
    # rather than through a thread pool. Alembic owns the migration history.
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    # Transport for fastapi.testclient.TestClient. Starlette now deprecates the
    # original httpx here and asks for httpx2, so using it keeps test runs clean.
    "httpx2>=2.0,<3.0",
    "pytest-asyncio>=0.24,<2.0",
    # Real PostgreSQL for the tests that depend on PostgreSQL semantics:
    # unique constraints under concurrency, sequences, transaction behaviour.
    # These tests skip automatically when Docker is unavailable.
    "testcontainers[postgres]>=4.8,<5.0",
]

[project.scripts]
reconai-investigation-service = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real PostgreSQL via Docker; skipped automatically without it",
]
