# Alembic configuration for the Investigation Service.
#
# This service owns its own migration history, entirely separate from the
# financial core's Flyway migrations. The two never touch each other's tables.
#
# The database URL is not set here: it comes from RECONAI_AGENT_DATABASE_URL
# via migrations/env.py, so migrations and the application always target the
# same database.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
