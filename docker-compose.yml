# Minimum local infrastructure for the ReconAI financial core.
#
# PostgreSQL holds the authoritative financial records. Kafka carries newly detected
# reconciliation exceptions to a future investigation service.
#
# The backend itself is not containerised here: it is run from backend/ with Maven
# against these two services.
#
#   docker compose up -d
#   cd backend && mvn spring-boot:run
#
# Host ports are overridable because a machine with PostgreSQL already installed
# normally holds 127.0.0.1:5432. Docker would still bind *:5432 and start cleanly, but
# the backend would silently connect to the local server instead of this container. To
# avoid that, publish elsewhere and point the backend at it:
#
#   RECONAI_POSTGRES_PORT=55432 docker compose up -d
#   RECONAI_DB_URL=jdbc:postgresql://localhost:55432/reconai mvn spring-boot:run

services:
  postgres:
    image: postgres:16-alpine
    container_name: reconai-postgres
    environment:
      POSTGRES_DB: reconai
      POSTGRES_USER: reconai
      POSTGRES_PASSWORD: reconai
    ports:
      - "${RECONAI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - reconai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconai -d reconai"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Single-node KRaft broker: no ZooKeeper, and no Schema Registry, because V1
    # publishes plain JSON.
    image: apache/kafka:3.8.1
    container_name: reconai-kafka
    ports:
      - "${RECONAI_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${RECONAI_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node, so one replica is all that is available.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  reconai-postgres-data:
