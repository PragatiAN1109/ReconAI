# Serves the Operations Console and proxies its two API prefixes.
#
# The browser only ever talks to this origin. It never resolves a Docker service
# name — those are resolved here, inside the network — which is what keeps the
# frontend same-origin and means neither backend needs CORS configured for the
# UI to work.
#
# The two prefixes and their rewrites mirror vite.config.ts exactly, so the
# application's API contract is identical in development and in production.

server {
    listen 80;
    server_name _;

    # Financial Core: authoritative transactions, settlements and exceptions.
    #   /api/core/exceptions/EX-1  ->  financial-core:8080/api/v1/exceptions/EX-1
    location /api/core/ {
        proxy_pass http://financial-core:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Investigation Service: investigations, recommendations, reviews, audit.
    #   /api/investigation/investigations  ->  investigation-service:8000/api/v1/investigations
    location /api/investigation/ {
        proxy_pass http://investigation-service:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An investigation run is a bounded agent loop over a language model.
        # The default 60s read timeout would cut it off mid-flight and report a
        # gateway error for a request that was working.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed bundle filenames, so these are safe to cache hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback. /investigations/INV-1003 is a client-side route with
    # no file behind it; without this, a refresh or a pasted link would 404.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html must never be cached, or a browser keeps loading an old
        # document that references bundle hashes the server no longer has.
        add_header Cache-Control "no-store";
    }
}
